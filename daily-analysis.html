<meta property="og:title" content="일일 실전 차트분석 | 미주스탁닷컴">
<meta property="og:description" content="Harry가 매일 직접 그리는 지지선·저항선·감마플립 실전 차트분석 아카이브.">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4689151958671592"
     crossorigin="anonymous"></script>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

  :root{
    --ink: #0a0d13;
    --panel: #10141d;
    --panel-2: #151b26;
    --line: #1f2632;
    --line-soft: #181e29;
    --text: #e7ebf2;
    --text-dim: #8892a4;
    --text-faint: #4c5566;
    --up: #ff4d5e;
    --down: #3d8bff;
    --cyan: #17e8c9;
    --amber: #f5c451;
    --violet: #a78bfa;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--ink); scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit; text-decoration:none;}

  .nav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,13,19,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1240px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:17px;}
  .logo-mark{
    width:28px; height:28px; border-radius:7px;
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-weight:900; color:#04120f; font-size:14px;
  }
  .dim{color:var(--text-faint); font-weight:600;}
  .links{display:flex; gap:26px; font-size:14px; color:var(--text-dim);}
  .links a:hover{color:var(--text);}
  @media(max-width:860px){ .links{display:none;} }

  main{max-width:900px; margin:0 auto; padding:48px 28px 80px;}

  .page-head{margin-bottom:40px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.12em; margin-bottom:10px;
  }
  .page-title{font-size:32px; font-weight:800; letter-spacing:-0.02em; margin-bottom:12px;}
  .page-title span{color:var(--cyan);}
  .page-desc{color:var(--text-dim); font-size:14.5px; line-height:1.7; max-width:640px;}

  #boardList{display:flex; flex-direction:column; gap:24px;}

  .post-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; box-shadow:0 20px 40px -20px rgba(0,0,0,0.5);
  }
  .post-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; background:var(--panel-2); border-bottom:1px solid var(--line);
  }
  .post-ticker{font-family:'JetBrains Mono', monospace; font-weight:800; font-size:14px; color:var(--text);}
  .post-date{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-faint);}
  .post-img{width:100%; display:block; background:#fff;}
  .post-body{padding:16px 18px;}
  .level-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .level-badge{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    padding:5px 10px; border-radius:6px;
  }
  .lv-support{background:rgba(61,139,255,0.14); color:var(--down);}
  .lv-flip{background:rgba(245,196,81,0.14); color:var(--amber);}
  .lv-resist{background:rgba(255,77,94,0.14); color:var(--up);}
  .post-summary{font-size:13.5px; color:var(--text-dim); line-height:1.7;}

  .empty-state, .loading-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
    border:1px dashed var(--line); border-radius:12px; font-size:13.5px;
  }

  footer{border-top:1px solid var(--line); padding:28px; text-align:center; color:var(--text-faint); font-size:12px;}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html" style="color:inherit;">
      <div class="logo-mark">M</div>
      MiJooStock<span class="dim">.com</span>
    </a>
    <nav class="links">
      <a href="guide-account.html">기초 가이드</a>
      <a href="guide-indicators.html">차트 분석</a>
      <a href="daily-analysis.html" style="color:var(--cyan);">일일 실전분석</a>
      <a href="guide-gex.html">GEX 옵션</a>
      <a href="guide-covered-call.html">월세 프로젝트</a>
      <a href="community.html">커뮤니티</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="eyebrow">Daily Analysis</div>
    <h1 class="page-title">Harry의 <span>일일 실전 차트분석</span></h1>
    <p class="page-desc">매일 직접 그리는 지지선·저항선·감마플립 기준 실전 분석입니다. 교육 목적의 참고 자료이며 투자 권유가 아닙니다.</p>
  </div>

  <div id="boardList">
    <div class="loading-state">불러오는 중...</div>
  </div>
</main>

<footer>© MiJooStock.com · 본 콘텐츠는 교육 목적이며 투자 권유가 아닙니다.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="analysis-render.js"></script>
<script>
(function(){
  var listEl = document.getElementById('boardList');

  MijooAnalysis.loadRows(
    function(rows){
      listEl.innerHTML = rows.map(function(r){
        return '<article class="post-card">' + MijooAnalysis.renderAnalysisBlock(r) + '</article>';
      }).join('');
    },
    function(){
      listEl.innerHTML = '<div class="empty-state">아직 등록된 분석이 없습니다. 곧 첫 글이 올라올 예정입니다.</div>';
    }
  );
})();
</script>

</body>
</html>
