<head>

<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

  :root{
    --ink: #0a0d13;
    --panel: #10141d;
    --panel-2: #151b26;
    --line: #1f2632;
    --line-soft: #181e29;
    --text: #e7ebf2;
    --text-dim: #8892a4;
    --text-faint: #4c5566;
    --up: #ff4d5e;
    --down: #3d8bff;
    --cyan: #17e8c9;
    --amber: #f5c451;
    --violet: #a78bfa;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--ink); scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  header.nav{
    position:sticky; top:0; z-index:20;
    background:rgba(10,13,19,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:960px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
  }
  .logo{
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:16px; letter-spacing:-0.02em;
  }
  .logo .dim{color:var(--text-faint); font-weight:500;}
  .back-link{font-size:13px; color:var(--text-dim);}

  main{max-width:960px; margin:0 auto; padding:32px 20px 80px;}

  .page-head{margin-bottom:24px;}
  .page-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.12em;
    margin-bottom:8px;
  }
  .page-title{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
  .page-desc{margin-top:10px; color:var(--text-dim); font-size:14px;}

  .tabs{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim);
    cursor:pointer;
  }
  .tab.active{
    background:var(--cyan); color:#04120f; border-color:var(--cyan);
  }

  .board-list{
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:var(--panel);
  }
  .board-row:last-child{border-bottom:none !important;}
  .board-row:hover{background:var(--panel-2);}

  .empty-state{
    padding:60px 20px; text-align:center;
    color:var(--text-faint); font-size:13px;
  }

  .detail-wrap{
    display:none;
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:var(--panel);
    margin-bottom:24px;
  }
  .detail-back{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:12px;
    color:var(--cyan); cursor:pointer; margin-bottom:16px;
  }

  footer{
    padding:32px 20px 60px; max-width:960px; margin:0 auto;
    font-size:12px; color:var(--text-faint);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">MiJooStock<span class="dim">.com</span></a>
    <a class="back-link" href="index.html">← 홈으로</a>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="page-eyebrow">Board</div>
    <h1 class="page-title">실전 GEX 분석</h1>
    <p class="page-desc">급등주 Call Wall/Put Wall 케이스, 한인 선호 종목 전략, 트레이딩 Q&amp;A를 한곳에서 확인하세요.</p>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="">전체</div>
    <div class="tab" data-cat="급등주케이스">급등주 케이스</div>
    <div class="tab" data-cat="한인선호종목">한인 선호 종목</div>
    <div class="tab" data-cat="트레이딩QNA">트레이딩 Q&amp;A</div>
  </div>

  <div class="detail-wrap" id="detailWrap">
    <div style="padding:16px 16px 0;">
      <span class="detail-back" id="detailBack">← 목록으로</span>
    </div>
    <div id="detailBody"></div>
  </div>

  <div class="board-list" id="boardList">
    <div class="empty-state">불러오는 중...</div>
  </div>
</main>

<footer>
  <div>© 2026 MiJooStock.com</div>
  <div style="display:flex; gap:16px;">
    <a href="terms.html">이용약관</a>
    <a href="privacy.html">개인정보처리방침</a>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="analysis-render.js"></script>
<script>
(function(){
  var allRows = [];
  var activeCategory = '';

  function getUrlCategory(){
    var params = new URLSearchParams(window.location.search);
    return params.get('cat') || '';
  }

  function renderList(){
    var listEl = document.getElementById('boardList');
    var filtered = activeCategory
      ? allRows.filter(function(r){ return r['카테고리'] === activeCategory; })
      : allRows;

    if (!filtered.length){
      listEl.innerHTML = '<div class="empty-state">아직 게시된 글이 없습니다.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function(r){
      var realIndex = allRows.indexOf(r);
      return MijooAnalysis.renderListRow(r, realIndex);
    }).join('');

    var rows = listEl.querySelectorAll('.board-row');
    rows.forEach(function(rowEl){
      rowEl.addEventListener('click', function(){
        var idx = parseInt(rowEl.getAttribute('data-index'), 10);
        showDetail(allRows[idx]);
      });
    });
  }

  function showDetail(r){
    document.getElementById('detailBody').innerHTML = MijooAnalysis.renderAnalysisBlock(r);
    document.getElementById('detailWrap').style.display = 'block';
    document.getElementById('boardList').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function hideDetail(){
    document.getElementById('detailWrap').style.display = 'none';
    document.getElementById('boardList').style.display = 'block';
  }

  document.getElementById('detailBack').addEventListener('click', hideDetail);

  var tabEls = document.querySelectorAll('.tab');
  tabEls.forEach(function(tabEl){
    tabEl.addEventListener('click', function(){
      tabEls.forEach(function(t){ t.classList.remove('active'); });
      tabEl.classList.add('active');
      activeCategory = tabEl.getAttribute('data-cat');
      hideDetail();
      renderList();
    });
  });

  MijooAnalysis.loadRows(
    function(rows){
      allRows = rows;
      var urlCat = getUrlCategory();
      if (urlCat){
        activeCategory = urlCat;
        tabEls.forEach(function(t){
          t.classList.toggle('active', t.getAttribute('data-cat') === urlCat);
        });
      }
      renderList();
    },
    function(){
      document.getElementById('boardList').innerHTML = '<div class="empty-state">분석 자료를 불러오지 못했습니다.</div>';
    }
  );
})();
</script>
