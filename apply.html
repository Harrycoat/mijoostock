<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신청하기 — MiJooStock.com</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

  :root{
    --ink: #0a0d13;
    --panel: #10141d;
    --panel-2: #151b26;
    --line: #1f2632;
    --line-soft: #181e29;
    --text: #e7ebf2;
    --text-dim: #8892a4;
    --text-faint: #4c5566;
    --up: #ff4d5e;
    --down: #3d8bff;
    --cyan: #17e8c9;
    --amber: #f5c451;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--ink);}
  body{
    background:var(--ink); color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit; text-decoration:none;}

  header.nav{
    border-bottom:1px solid var(--line);
    background:rgba(10,13,19,0.9);
  }
  .nav-inner{
    max-width:720px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:16px; letter-spacing:-0.02em;
  }
  .logo-mark{
    width:20px; height:20px; border-radius:4px;
    background:linear-gradient(135deg, var(--cyan), #0a9d87);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#04120f;
  }
  .logo .dim{color:var(--text-faint); font-weight:500;}
  .back-link{font-size:13px; color:var(--text-dim);}

  main{max-width:640px; margin:0 auto; padding:56px 24px 80px;}

  .page-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.12em;
    margin-bottom:10px;
  }
  .page-title{
    font-size:clamp(24px, 4vw, 32px);
    font-weight:800; letter-spacing:-0.02em;
    margin-bottom:12px;
  }
  .page-desc{color:var(--text-dim); font-size:14.5px; margin-bottom:36px;}

  /* 신청 종류 선택 탭 */
  .type-select{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; margin-bottom:36px;
  }
  @media(max-width:560px){ .type-select{grid-template-columns:1fr;} }
  .type-option{
    background:var(--panel);
    padding:20px 16px;
    cursor:pointer;
    text-align:left;
    border:none; color:var(--text);
    font-family:'Pretendard', sans-serif;
    transition:background .15s;
    display:flex; flex-direction:column; gap:6px;
  }
  .type-option:hover{background:var(--panel-2);}
  .type-option.active{background:var(--panel-2); box-shadow:inset 0 0 0 1.5px var(--cyan);}
  .type-badge{
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:800;
    letter-spacing:0.03em; align-self:flex-start;
    padding:3px 8px; border-radius:5px;
  }
  .badge-free{background:rgba(61,139,255,0.14); color:var(--down);}
  .badge-mid{background:rgba(23,232,201,0.14); color:var(--cyan);}
  .badge-pro{background:rgba(245,196,81,0.16); color:var(--amber);}
  .type-name{font-size:14.5px; font-weight:700;}
  .type-sub{font-size:12px; color:var(--text-faint); line-height:1.5;}

  /* 폼 */
  form{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:32px;
  }
  .field{margin-bottom:20px;}
  .field label{
    display:block; font-size:13px; font-weight:600; color:var(--text-dim);
    margin-bottom:8px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    color:var(--text);
    font-family:'Pretendard', sans-serif;
    font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--cyan);
  }
  .field textarea{resize:vertical; min-height:96px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:480px){ .field-row{grid-template-columns:1fr;} }

  .field-hint{font-size:12px; color:var(--text-faint); margin-top:6px;}

  .submit-btn{
    width:100%;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:14.5px;
    background:var(--cyan); color:#04120f;
    padding:15px; border-radius:8px; border:none;
    cursor:pointer;
    margin-top:8px;
  }
  .submit-btn.pro{background:var(--amber);}

  .disclaimer-note{
    margin-top:20px;
    font-size:11.5px; color:var(--text-faint);
    line-height:1.7; text-align:center;
  }

  .trust-row{
    display:flex; gap:20px; margin-top:28px; flex-wrap:wrap;
    font-size:12px; color:var(--text-faint);
  }
  .trust-row span{display:flex; align-items:center; gap:6px;}
  .trust-dot{width:6px; height:6px; border-radius:50%; background:var(--cyan);}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="logo">
      <div class="logo-mark">M</div>
      MiJooStock<span class="dim">.com</span>
    </div>
    <a class="back-link" href="index.html">← 메인으로</a>
  </div>
</header>

<main>
  <div class="page-eyebrow">Apply</div>
  <h1 class="page-title">무엇을 도와드릴까요?</h1>
  <p class="page-desc">아래에서 신청하실 항목을 선택하고, 간단한 정보만 남겨주세요. 확인 후 개별 연락드립니다.</p>

  <div class="type-select" id="typeSelect">
    <button type="button" class="type-option" data-type="account" onclick="selectType('account')">
      <span class="type-badge badge-free">STEP 1 · 무료</span>
      <span class="type-name">🏦 계좌개설 문의</span>
      <span class="type-sub">어떤 증권사가 맞을지, 계좌는 어떻게 여는지 상담받기</span>
    </button>
    <button type="button" class="type-option" data-type="chart" onclick="selectType('chart')">
      <span class="type-badge badge-mid">STEP 2 · 유료</span>
      <span class="type-name">📐 차트세팅 신청</span>
      <span class="type-sub">ThinkorSwim / Webull 실전 지표 직접 세팅</span>
    </button>
    <button type="button" class="type-option" data-type="coaching" onclick="selectType('coaching')">
      <span class="type-badge badge-pro">STEP 3 · 1:1 코칭</span>
      <span class="type-name">🎯 1:1 강의 신청</span>
      <span class="type-sub">계좌개설부터 옵션 전략까지 맞춤 코칭</span>
    </button>
  </div>

  <form onsubmit="return handleSubmit(event)">
    <div class="field">
      <label>신청 종류</label>
      <select id="typeDisplay" disabled>
        <option value="account">🏦 계좌개설 문의 (무료)</option>
        <option value="chart">📐 차트세팅 신청 (유료)</option>
        <option value="coaching">🎯 1:1 강의 신청 (1:1 코칭)</option>
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label>이름</label>
        <input type="text" placeholder="홍길동" required>
      </div>
      <div class="field">
        <label>연락처</label>
        <input type="tel" placeholder="010-0000-0000" required>
      </div>
    </div>

    <div class="field">
      <label>이메일</label>
      <input type="email" placeholder="you@email.com" required>
    </div>

    <div class="field">
      <label>현재 투자 경험</label>
      <select>
        <option>미국 주식 계좌 없음 (완전 초보)</option>
        <option>계좌는 있지만 매매 경험 적음</option>
        <option>매매 경험 있음, 옵션은 처음</option>
        <option>옵션 거래 경험 있음</option>
      </select>
    </div>

    <div class="field">
      <label id="msgLabel">문의 내용</label>
      <textarea id="msgField" placeholder="궁금하신 점이나 상황을 자유롭게 적어주세요."></textarea>
      <div class="field-hint" id="msgHint">예: 어떤 증권사가 좋을지 모르겠어요, 계좌 개설 절차가 궁금해요</div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">문의 신청하기 →</button>

    <p class="disclaimer-note">
      본 신청은 상담 및 교육 목적이며, 특정 종목에 대한 투자 권유가 아닙니다.<br>
      제출하신 정보는 상담 목적으로만 사용되며 제3자에게 제공되지 않습니다.
    </p>
  </form>

  <div class="trust-row">
    <span><span class="trust-dot"></span>평균 응답 1영업일 이내</span>
    <span><span class="trust-dot"></span>개인정보 안전 보호</span>
  </div>
</main>

<script>
  const config = {
    account: {
      badge: 'STEP 1 · 무료',
      submitText: '문의 신청하기 →',
      submitClass: '',
      msgLabel: '문의 내용',
      msgHint: '예: 어떤 증권사가 좋을지 모르겠어요, 계좌 개설 절차가 궁금해요'
    },
    chart: {
      badge: 'STEP 2 · 유료',
      submitText: '차트세팅 신청하기 →',
      submitClass: '',
      msgLabel: '세팅 요청 사항',
      msgHint: '예: TTM Squeeze, RSI, Hull21 지표를 넣고 싶어요 / 현재 쓰는 플랫폼 알려주세요'
    },
    coaching: {
      badge: 'STEP 3 · 1:1 코칭',
      submitText: '1:1 강의 신청하기 →',
      submitClass: 'pro',
      msgLabel: '상담받고 싶은 내용',
      msgHint: '예: 옵션 전략을 배우고 싶어요 / 포트폴리오 점검을 받고 싶어요'
    }
  };

  function selectType(type){
    document.querySelectorAll('.type-option').forEach(el=>{
      el.classList.toggle('active', el.dataset.type === type);
    });
    document.getElementById('typeDisplay').value = type;

    const c = config[type];
    const btn = document.getElementById('submitBtn');
    btn.textContent = c.submitText;
    btn.className = 'submit-btn ' + c.submitClass;
    document.getElementById('msgLabel').textContent = c.msgLabel;
    document.getElementById('msgHint').textContent = c.msgHint;
  }

  // URL 파라미터로 미리 선택 (예: apply.html?type=coaching)
  const params = new URLSearchParams(window.location.search);
  const initialType = params.get('type') || 'account';
  selectType(initialType);

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1593bgMzO7Dz9BHfLAr3L7Htr4Rude80iUUWSXDjkgWAYKtBm1C-gFOhPKmqw0uAfHg/exec';

  function handleSubmit(e){
    e.preventDefault();

    const form = e.target;
    const btn = document.getElementById('submitBtn');
    const originalText = btn.textContent;
    btn.textContent = '전송 중...';
    btn.disabled = true;

    const payload = {
      type: document.getElementById('typeDisplay').value,
      name: form.querySelector('input[type="text"]').value,
      phone: form.querySelector('input[type="tel"]').value,
      email: form.querySelector('input[type="email"]').value,
      experience: form.querySelector('select:not(#typeDisplay)').value,
      message: document.getElementById('msgField').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert('신청이 접수되었습니다. 곧 연락드리겠습니다.');
      form.reset();
      selectType(payload.type);
    })
    .catch(() => {
      alert('전송 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.');
    })
    .finally(() => {
      btn.textContent = originalText;
      btn.disabled = false;
    });

    return false;
  }
</script>

</body>
</html>
